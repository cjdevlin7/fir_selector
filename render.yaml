services:
  - type: web
    name: fir-selector
    runtime: python
    buildCommand: pip install -r requirements.txt && python3 warm_cartopy_cache.py
    # max-requests recycles the worker periodically so any memory the
    # allocator hasn't handed back to the OS gets reclaimed on restart —
    # a safety net for the 512MB free tier, since a stale worker could
    # otherwise accumulate usage across many renders over its lifetime.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --max-requests 15 --max-requests-jitter 5
    autoDeploy: true
